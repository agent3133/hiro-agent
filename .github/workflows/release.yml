# A tag x.y.z builds the release from the source at that tag and publishes main.js, manifest.json and styles.css —
# what Obsidian downloads. The tag message's body (below its first line, the version) is the release notes.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: The tag is the manifest's version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, manifest.json says $version"
            exit 1
          fi
          node -e "const v = require('./versions.json'); if (!v['$version']) { console.log('versions.json has no $version'); process.exit(1) }"
      - run: npm ci
      - run: npm run check-notices
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Provenance for main.js
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: main.js
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
